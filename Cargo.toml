[workspace]
resolver = "3"
members = ["crates/duallink-core", "crates/duallink-service", "crates/duallink-app"]

[workspace.package]
version = "5.0.0-dev.1"
edition = "2024"

publish = false

[workspace.dependencies]
duallink-core = { path = "crates/duallink-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
