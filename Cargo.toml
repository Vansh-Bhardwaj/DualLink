[workspace]
resolver = "3"
members = ["crates/duallink-core", "crates/duallink-service", "crates/duallink-app"]

[workspace.package]
version = "5.0.0-dev.2"
edition = "2024"

publish = false

[workspace.dependencies]
duallink-core = { path = "crates/duallink-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# The interface framework is pre-release and pinned to one revision. It builds against its
# own copies of these crates, and Cargo does not inherit patches from a dependency, so they
# are repeated here. Keep every revision below identical to the one in crates/duallink-app.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
