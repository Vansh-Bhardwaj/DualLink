name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --workspace --release --locked

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/DualLink/DualLink.csproj --configfile NuGet.Config
      - name: Build app
        run: dotnet build src/DualLink/DualLink.csproj -c Release --no-restore
      - name: Build watchdog
        run: dotnet build src/DualLink.Watchdog/DualLink.Watchdog.csproj -c Release
      - name: Build privileged service
        run: dotnet build src/DualLink.Service/DualLink.Service.csproj -c Release
      - name: Run integration tests
        run: dotnet run --project tests/DualLink.Tests/DualLink.Tests.csproj -c Release
      - name: Run window recovery tests
        run: dotnet run --project tests/DualLink.UiTests/DualLink.UiTests.csproj -c Release
