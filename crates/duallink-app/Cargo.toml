[package]
name = "duallink-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "DualLink"
path = "src/main.rs"

[dependencies]
duallink-core.workspace = true
serde_json.workspace = true
rune = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3468f3a3b6c690336a94a8a57e66a149c2a422dc" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
